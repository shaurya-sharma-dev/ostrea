[project]
name = "Ostrea"
dynamic = ["version"]
description = "Ostrea is an educational website about oyster gardening."
authors = [
    { name = "Shaurya Sharma" },
    { name = "Shreya Sharma" }
]
dependencies = ["Django==6.0.7", "django-allauth==65.18.0", "django-allauth-ui==1.8.1", "django-widget-tweaks==1.5.1", "slippers==0.6.3", "python-dotenv==1.2.2", "django-ninja==1.6.2", "pydantic==2.13.4", "daphne==4.2.3", "channels==4.3.2"]
requires-python = "==3.12.*"
readme = "README.md"
license = "MPL-2.0"
license-files = ["LICENSE*"]


[tool.pdm]
distribution = false

[tool.pdm.version]
source = "call"
getter = "ostrea._version:_get_version_string"

[tool.pdm.scripts]
get-version = { call = "ostrea._version:_print_version_and_integrity" }
test = "python manage.py test"